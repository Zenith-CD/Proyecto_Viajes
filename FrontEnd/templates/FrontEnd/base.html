{% load static %}
<!DOCTYPE html>
<html lang="es-cl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ruta Austral Viajes{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'blog' %}">Ruta Austral Viajes</a>
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="{% url 'blog' %}">Viajes</a>
      <a class="nav-link" href="{% url 'personas' %}">Personas</a>
      <a class="nav-link" href="{% url 'lugares' %}">Lugares</a>
    </div>
    <div class="navbar-nav" id="nav-auth"></div>
  </div>
</nav>

<main class="container">
  {% block content %}{% endblock %}
</main>

<script src="{% static 'FrontEnd/js/api.js' %}"></script>
<script>
  // Menú según estado de sesión
  const navAuth = document.getElementById('nav-auth');
  navAuth.innerHTML = Auth.isLoggedIn()
    ? '<a class="nav-link" href="#" onclick="logout()">Cerrar sesión</a>'
    : '<a class="nav-link" href="/login/">Iniciar sesión</a>';
  const LOGUEADO = Auth.isLoggedIn();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
