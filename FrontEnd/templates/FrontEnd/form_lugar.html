{% extends 'FrontEnd/base.html' %}
{% block title %}Formulario de lugar{% endblock %}
{% block content %}
<h2 id="titulo">Nuevo lugar</h2>
<div id="msg"></div>
<div id="datos" data-pk="{{ pk|default:'' }}" hidden></div> <!-- <--- correccion -->
<form id="form" class="card card-body shadow-sm" enctype="multipart/form-data">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Nombre</label>
      <input class="form-control" name="nombre" required></div>
    <div class="col-md-3"><label class="form-label">País</label>
      <input class="form-control" name="pais" required></div>
    <div class="col-md-3"><label class="form-label">Ciudad</label>
      <input class="form-control" name="ciudad" required></div>
    <div class="col-12"><label class="form-label">Descripción</label>
      <textarea class="form-control" name="descripcion" rows="4" required></textarea></div>
    <div class="col-12"><label class="form-label">Foto</label>
      <input type="file" class="form-control" name="foto" accept="image/*"></div>
  </div>
  <div class="mt-3">
    <button class="btn btn-primary">Guardar</button>
    <a href="{% url 'lugares' %}" class="btn btn-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
{% block scripts %}
<script>
const PK = Number(document.getElementById('datos').dataset.pk) || null; // <--- correccion
const form = document.getElementById('form');
const msg = document.getElementById('msg');

if (!Auth.isLoggedIn()) window.location.href = '/login/';

if (PK) {
  document.getElementById('titulo').textContent = 'Editar lugar';
  apiFetch(`/lugares/${PK}/`).then(d => llenarForm(form, d)).catch(e => mostrarErrores(e, msg));
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(form);
  const foto = fd.get('foto');
  if (!foto || foto.size === 0) fd.delete('foto');
  try {
    await apiFetch(PK ? `/lugares/${PK}/` : '/lugares/', { method: PK ? 'PUT' : 'POST', body: fd });
    window.location.href = '/lugares/';
  } catch (err) { mostrarErrores(err, msg); }
});
</script>
{% endblock %}
