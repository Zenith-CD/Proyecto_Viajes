{% extends 'FrontEnd/base.html' %}
{% block title %}Formulario de viaje{% endblock %}
{% block content %}
<h2 id="titulo">Nuevo viaje</h2>
<div id="msg"></div>
<div id="datos" data-pk="{{ pk|default:'' }}" hidden></div> <!-- <--- correccion -->
<form id="form" class="card card-body shadow-sm" enctype="multipart/form-data">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Persona</label>
      <select class="form-select" name="persona" required><option value="">Seleccione...</option></select></div>
    <div class="col-md-6"><label class="form-label">Lugar</label>
      <select class="form-select" name="lugar" required><option value="">Seleccione...</option></select></div>
    <div class="col-md-8"><label class="form-label">Título</label>
      <input class="form-control" name="titulo" required></div>
    <div class="col-md-4"><label class="form-label">Fecha de visita</label>
      <input type="date" class="form-control" name="fecha_visita" required></div>
    <div class="col-12"><label class="form-label">Relato</label>
      <textarea class="form-control" name="relato" rows="5" required></textarea></div>
    <div class="col-md-4"><label class="form-label">Calificación (1 a 5)</label>
      <select class="form-select" name="calificacion" required>
        <option value="">Seleccione...</option>
        <option value="1">1 ★</option><option value="2">2 ★★</option><option value="3">3 ★★★</option>
        <option value="4">4 ★★★★</option><option value="5">5 ★★★★★</option>
      </select></div>
    <div class="col-md-8"><label class="form-label">Foto</label>
      <input type="file" class="form-control" name="foto" accept="image/*"></div>
  </div>
  <div class="mt-3">
    <button class="btn btn-primary">Guardar</button>
    <a href="{% url 'blog' %}" class="btn btn-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
{% block scripts %}
<script>
const PK = Number(document.getElementById('datos').dataset.pk) || null; // <--- correccion
const form = document.getElementById('form');
const msg = document.getElementById('msg');

if (!Auth.isLoggedIn()) window.location.href = '/login/';

async function iniciar() {
  try {
    const [personas, lugares] = await Promise.all([apiFetch('/personas/'), apiFetch('/lugares/')]);
    personas.forEach(p => form.persona.insertAdjacentHTML('beforeend',
      `<option value="${p.id}">${esc(p.nombre)} ${esc(p.apellido)} (${esc(p.rut)})</option>`));
    lugares.forEach(l => form.lugar.insertAdjacentHTML('beforeend',
      `<option value="${l.id}">${esc(l.nombre)} - ${esc(l.ciudad)}</option>`));

    if (PK) {
      document.getElementById('titulo').textContent = 'Editar viaje';
      llenarForm(form, await apiFetch(`/viajes/${PK}/`));
    }
  } catch (err) { mostrarErrores(err, msg); }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(form);
  const foto = fd.get('foto');
  if (!foto || foto.size === 0) fd.delete('foto');
  try {
    const v = await apiFetch(PK ? `/viajes/${PK}/` : '/viajes/', { method: PK ? 'PUT' : 'POST', body: fd });
    window.location.href = `/viaje/${v.id}/`;
  } catch (err) { mostrarErrores(err, msg); }
});
iniciar();
</script>
{% endblock %}
