{% extends 'FrontEnd/base.html' %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm"><div class="card-body">
      <h3 class="mb-3">Iniciar sesión</h3>
      <div id="msg"></div>
      <form id="form-login">
        <div class="mb-3"><label class="form-label">Usuario</label>
          <input class="form-control" name="username" required></div>
        <div class="mb-3"><label class="form-label">Contraseña</label>
          <input type="password" class="form-control" name="password" required></div>
        <button class="btn btn-primary w-100">Entrar</button>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target, msg = document.getElementById('msg');
  try {
    await login(f.username.value, f.password.value);
    window.location.href = '/';
  } catch (err) {
    msg.className = 'alert alert-danger';
    msg.textContent = err.message;
  }
});
</script>
{% endblock %}
